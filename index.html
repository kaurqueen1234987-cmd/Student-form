<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Sign Up</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg,#89f7fe,#a18cd1);
  padding: 30px 15px;
}

.box {
  background: white;
  padding: 30px;
  max-width: 380px;
  margin: 50px auto;
  border-radius: 15px;
  box-shadow: 0 5px 15px #555;
}

h1 {
  text-align: center;
  color: #673ab7;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  background: #673ab7;
  color: white;
  padding: 13px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:disabled { opacity: 0.6; }

#message {
  text-align: center;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="box">
<h1>Student Sign Up</h1>
<p>Create Your Account</p>

<form id="signupForm">
<input id="name" type="text"
placeholder="Enter Your Name" required>

<input id="email" type="email"
placeholder="Enter Your Email" required>

<input id="password" type="password"
placeholder="Create Password"
minlength="6" required>

<button id="signupBtn" type="submit">
Sign Up
</button>
</form>

<p id="message"></p>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAui_73IiFeFnpC7EkFqkCoc6FlDwhqhGA",
  authDomain: "student-form-91ccf.firebaseapp.com",
  projectId: "student-form-91ccf",
  storageBucket: "student-form-91ccf.firebasestorage.app",
  messagingSenderId: "812729360263",
  appId: "1:812729360263:web:ada5aafd21bec488fafd22",
  measurementId: "G-NM3BZFZQ2M"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const button = document.getElementById("signupBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  message.textContent = "Creating your account...";

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(result.user, {
      displayName: name
    });

    message.textContent = "Account created successfully!";

    window.location.href = "enrollment.html";

  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
  }
});

</script>

</body>
</html>
