
<!DOCTYPE html>
<html>
<head>
    <title>Student Sign Up</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(120deg, #89f7fe, #a18cd1);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 35px;
            width: 300px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            color: #673ab7;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #673ab7;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Student Sign Up</h1>

    <p>Create Your Account</p>

    <form action="enrollment.html" method="get">

        <input type="text"
        name="username"
        placeholder="Enter Your Name"
        required>

        <input type="email"
        name="email"
        placeholder="Enter Your Email"
        required>

        <input type="password"
        name="password"
        placeholder="Create Password"
        required>

        <button type="submit">Sign Up</button>

    </form>

</div>

</body>
</html>
