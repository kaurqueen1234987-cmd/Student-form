

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Enrollment Form</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#d9e8ff,#f7d9f2,#d8fff0);
}

.container {
  max-width: 620px;
  margin: 20px auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 12px 35px #35456b30;
}

.live {
  display: inline-block;
  background: #e4fff0;
  color: #087c43;
  padding: 9px 15px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: bold;
}

h1 { color: #3546a5; text-align: center; }
.subtitle { text-align: center; color: #777; }

label {
  display: block;
  margin-top: 14px;
  color: #39466b;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #d4d9eb;
  border-radius: 9px;
  font-size: 15px;
}

textarea { min-height: 85px; }

button {
  width: 100%;
  margin-top: 23px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#5368db,#a34cc5);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .65; cursor: wait; }

#statusMessage {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
}

.success { color: #087c43; background: #e4fff0; }
.error { color: #b42318; background: #fff0ef; }

.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

  <div style="text-align:center">
    <span class="live">● LIVE ENROLLMENT FORM</span>
  </div>

  <h1>Student Enrollment</h1>
  <p class="subtitle">Complete the form to register your details</p>

  <form id="enrollmentForm">

    <label>Full Name</label>
    <input name="studentName" type="text"
      placeholder="Enter your full name" required>

    <label>Email Address</label>
    <input name="email" type="email"
      placeholder="Enter your email" required>

    <label>Phone Number</label>
    <input name="phone" type="tel"
      placeholder="Enter phone number" required>

    <label>Select Course</label>
    <select name="course" required>
      <option value="">Choose your course</option>
      <option value="B.Tech">B.Tech</option>
      <option value="BCA">BCA</option>
      <option value="BBA">BBA</option>
      <option value="MCA">MCA</option>
      <option value="Other">Other</option>
    </select>

    <label>Branch / Field</label>
    <input name="field" type="text"
      placeholder="Enter your branch" required>

    <label>College Name</label>
    <input name="college" type="text"
      placeholder="Enter college name" required>

    <label>Roll Number</label>
    <input name="rollNumber" type="text"
      placeholder="Enter roll number" required>

    <label>Address</label>
    <textarea name="address"
      placeholder="Enter your address" required></textarea>

    <button type="submit" id="submitBtn">
      Submit Enrollment
    </button>

  </form>

  <p id="statusMessage" role="status" aria-live="polite"></p>

  <div class="footer">
    Student Registration Portal | Enrollment Form
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx3rZxPrgbEHuLofGnnEP7Pu361ahwM1a1ezGzU88U8PJctwtAUfetl5afgfho6-lbCBw/exec";

const form = document.getElementById("enrollmentForm");
const button = document.getElementById("submitBtn");
const statusMessage = document.getElementById("statusMessage");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!GOOGLE_SCRIPT_URL.endsWith("/exec")) {
    statusMessage.className = "error";
    statusMessage.textContent = "Please check your Google Script URL.";
    return;
  }

  button.disabled = true;
  button.textContent = "Submitting...";
  statusMessage.className = "";
  statusMessage.textContent = "Saving your enrollment...";

  const studentData =
    Object.fromEntries(new FormData(form).entries());

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(studentData)
    });

    statusMessage.className = "success";
    statusMessage.textContent =
      "Request sent! Please verify your enrollment in Google Sheets.";

    form.reset();

  } catch (error) {
    statusMessage.className = "error";
    statusMessage.textContent =
      "Submission failed. Please try again.";
  } finally {
    button.disabled = false;
    button.textContent = "Submit Enrollment";
  }
});
</script>

</body>
</html>
