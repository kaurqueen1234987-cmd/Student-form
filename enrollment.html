<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Enrollment Form</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #eef2ff;
  padding: 20px;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px #0002;
}

h2 {
  text-align: center;
  color: #263b80;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 9px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  background: #263b80;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:disabled { opacity: 0.6; }

#message {
  text-align: center;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
<h2>Student Enrollment Form</h2>

<form id="enrollmentForm">
<input id="studentName" placeholder="Student Name" required>
<input id="email" type="email" placeholder="Email Address" required>
<input id="phone" type="tel" placeholder="Phone Number" required>
<input id="course" placeholder="Course Name" required>
<input id="field" placeholder="Field / Branch" required>
<input id="college" placeholder="College Name">
<input id="rollNumber" placeholder="Roll Number">
<textarea id="address" placeholder="Full Address" required></textarea>

<button type="submit" id="submitBtn">Submit Enrollment</button>
</form>

<p id="message"></p>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqQ-GaXWqYtxnQHQSczQhgqEdqHUqAYkKrS2D6YFKbTzSZBbd-OoMEF97ZYqoCaDl07w/exec";

const form = document.getElementById("enrollmentForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const data = {
    studentName: document.getElementById("studentName").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    course: document.getElementById("course").value.trim(),
    field: document.getElementById("field").value.trim(),
    college: document.getElementById("college").value.trim(),
    rollNumber: document.getElementById("rollNumber").value.trim(),
    address: document.getElementById("address").value.trim()
  };

  button.disabled = true;
  message.textContent = "Submitting...";

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    message.textContent = "Request sent. Please check your Google Sheet.";

    form.reset();

  } catch (error) {
    message.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
